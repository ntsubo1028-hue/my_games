<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ボクらのデジタル秘密基地 - my_games</title>
  
  <!-- 外部ライブラリ -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ① メインメニュー画面 -->
  <div id="menu-screen" class="screen active">
    <div class="hero-header">
      <div class="secret-badge">🎮 P2P Arcade</div>
      <h1>ボクらの<br>デジタル秘密基地</h1>
      <p class="subtitle">my_games</p>
    </div>
    <div class="menu-container">
      <button id="btn-goto-host-select" class="btn-action host-btn">ホストとして部屋を作る</button>
      <button id="btn-guest" class="btn-action guest-btn">ゲストとして参加する</button>

      <h2 style="margin-top: 2rem; font-size: 1.2rem; color: #555;">一人で遊ぶ</h2>
      <button id="btn-play-tetris" class="secondary-btn">テトリス</button>
    </div>
  </div>

  <!-- ② ホスト用：ゲーム選択画面 -->
  <div id="host-game-select-screen" class="screen">
    <h2>遊ぶゲームを選択</h2>
    <div class="menu-container">
      <button id="btn-select-othello" class="btn-action" style="background-color: #2e7d32;">🟢 オセロ (1対1)</button>
      <button id="btn-select-dots" class="btn-action" style="background-color: #e65100;">🟠 ドット＆ボックス (1対1)</button>
    </div>
    <button id="btn-back-main" class="btn-action secondary-btn" style="margin-top: 20px;">◀ メニューに戻る</button>
  </div>

  <!-- ③ 通信確立画面（ホスト・ゲスト共通） -->
  <div id="connection-screen" class="screen">
    <h3 id="conn-title">接続の準備</h3>
    <p id="conn-status" class="loading-text"></p>
    <img id="conn-qr" class="qr-img" alt="QRコード">
    <button id="btn-toggle-qr" class="btn-action" style="background-color: #607d8b; display: none; padding: 8px 16px; font-size: 14px;">QRコードを切り替える (1 ⇄ 2 ⇄ 3)</button>
    <button id="btn-start-scan" class="btn-action" style="display: none;">相手のQRを読む (全3枚)</button>
    <button id="btn-back-select" class="btn-action secondary-btn" style="margin-top: 15px;">◀ 戻る</button>
  </div>

  <!-- カメラ読み取り画面 -->
  <div id="camera-screen" class="screen">
    <h3 id="scan-guide-text">枠内にQRコードを合わせてください</h3>
    <div id="reader"></div>
    <button id="btn-cancel-scan" class="btn-action secondary-btn">キャンセル</button>
  </div>

  <!-- ④ ゲーム本体画面 (オセロ) -->
  <div id="game-screen" class="screen">
    <h2 id="turn-text">通信待機中...</h2>
    <div id="score-board">
      <span id="score-black">黒: 2</span>
      <span id="score-white">白: 2</span>
    </div>
    <div id="board"></div>
    <button id="btn-rematch-othello" class="btn-action" style="display: none; background-color: #fbc02d; color: #000; margin-top: 20px; font-size: 16px;">🔄 もう一度遊ぶ（再戦）</button>
    <button id="btn-quit-game" class="btn-action secondary-btn" style="margin-top: 20px; font-size: 14px; padding: 8px 16px;">ゲームを辞めてメニューに戻る</button>
  </div>

  <!-- ⑤ ゲーム本体画面 (ドット＆ボックス) -->
  <div id="dots-game-screen" class="screen">
    <h2 id="dots-turn-text">通信待機中...</h2>
    <div id="dots-score-board" style="display: flex; justify-content: space-between; width: 100%; padding: 10px 20px; font-weight: bold; font-size: 16px; box-sizing: border-box; background: #f0f0f0; border-radius: 8px; margin-bottom: 15px;">
      <span id="dots-score-host" style="color: #d32f2f;">ホスト(赤): 0</span>
      <span id="dots-score-guest" style="color: #1976d2;">ゲスト(青): 0</span>
    </div>
    <div id="dots-board-container"></div>
    <button id="btn-rematch-dots" class="btn-action" style="display: none; background-color: #fbc02d; color: #000; margin-top: 20px; font-size: 16px;">🔄 もう一度遊ぶ（再戦）</button>
    <button id="btn-quit-dots" class="btn-action secondary-btn" style="margin-top: 20px; font-size: 14px; padding: 8px 16px;">ゲームを辞めてメニューに戻る</button>
  </div>

  <!-- 画面: テトリス (一人用) -->
  <div id="tetris-game-screen" class="screen">
    <h2>テトリス</h2>
    <div class="tetris-info">
      <span id="tetris-score">スコア: 0</span>
      <span id="tetris-lines">ライン: 0</span>
    </div>
    
    <!-- テトリス盤面 -->
    <canvas id="tetris-board" width="200" height="400"></canvas>
    
    <!-- スマホ用コントローラー -->
    <div class="tetris-controls">
      <div class="control-row">
        <button id="btn-tetris-up">↻</button>
      </div>
      <div class="control-row">
        <button id="btn-tetris-left">←</button>
        <button id="btn-tetris-down">↓</button>
        <button id="btn-tetris-right">→</button>
      </div>
      <div class="control-row">
        <button id="btn-tetris-drop" style="width:120px; border-radius:25px;">⏬ 一気に落とす</button>
      </div>
    </div>
    
    <div class="btn-area">
      <button id="btn-rematch-tetris" style="display:none;">もう一度遊ぶ</button>
      <button id="btn-quit-tetris" class="secondary-btn">メニューに戻る</button>
    </div>
  </div>

  <!-- メインJSモジュールの読み込み -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
